name: Build native artifacts
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON array of target keys (defaults to the complete matrix)'
        default: '["linux-x64","linux-arm64","linux-riscv64","macos-arm64","macos-x64","ios-arm64-iphoneos","ios-arm64-iphonesimulator","ios-x64-iphonesimulator","android-arm","android-arm64","android-x64","windows-x64","windows-arm64"]'
        required: true
      mode:
        description: 'build, or verify existing Linux artifacts under native/QEMU loading'
        type: choice
        options: [build, verify]
        default: build
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ startsWith(matrix.target, 'windows-') && 'windows-2022' || (startsWith(matrix.target, 'macos-') || startsWith(matrix.target, 'ios-')) && 'macos-15' || 'ubuntu-22.04' }}
    env:
      SNE_TARGET: ${{ matrix.target }}
      SNE_MODE: ${{ inputs.mode }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: super_native_extensions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned NDK
        if: startsWith(matrix.target, 'android-')
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Select Apple SDK
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
      - name: Build Linux in pinned container
        if: startsWith(matrix.target, 'linux-')
        run: tool/build_native_linux_docker.sh "$SNE_TARGET" "$SNE_MODE"
      - name: Build native artifact
        if: ${{ inputs.mode != 'verify' && !startsWith(matrix.target, 'linux-') }}
        run: tool/build_native_artifact.sh "$SNE_TARGET"
      - if: inputs.mode != 'verify'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sne-${{ matrix.target }}
          path: super_native_extensions/native_artifacts/${{ matrix.target }}/
          if-no-files-found: error
