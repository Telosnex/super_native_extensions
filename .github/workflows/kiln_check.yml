name: Kiln check

on:
  pull_request:
    branches: [main, native-prebuilt]
    paths:
      - super_native_extensions/native_artifacts/prebuilt.json
      - super_native_extensions/native_artifacts/source_excludes.txt
      - .github/workflows/kiln_check.yml
  schedule:
    - cron: '27 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-check:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_check.yml@46806695c593ec632eb26996046ea89649a1a6f7 # v0.5.9
    with:
      working-directory: super_native_extensions
