name: Kiln check

on:
  pull_request:
    branches: [main, native-prebuilt]
    paths:
      - super_native_extensions/native_artifacts/prebuilt.json
      - super_native_extensions/native_artifacts/source_excludes.txt
      - .github/workflows/kiln_check.yml
  schedule:
    - cron: '27 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-check:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_check.yml@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
    with:
      working-directory: super_native_extensions
