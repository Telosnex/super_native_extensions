name: Kiln check

on:
  pull_request:
    branches: [main, native-prebuilt]
    paths:
      - super_native_extensions/native_artifacts/prebuilt.json
      - super_native_extensions/native_artifacts/source_excludes.txt
      - .github/workflows/kiln_check.yml
  schedule:
    - cron: '27 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-check:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_check.yml@c1c96dee1b426f3617d5e9caf60fd45899bb8a4f # v0.5.20
    with:
      working-directory: super_native_extensions
