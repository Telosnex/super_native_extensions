# The Rust checks of super_native_extensions/rust: rustfmt, and clippy and
# cargo test on each desktop host with stable and nightly Rust (clippy also
# for Android and iOS). The Flutter checks are in unit.yml.
name: Check and lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-and-lint-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default stable
      - run: rustup update
      - run: rustup component add rustfmt
      - run: cargo fmt --all --manifest-path super_native_extensions/rust/Cargo.toml -- --check

  # One job per host and Rust channel (no matrix: the run graph shows each).
  # They share the steps of the first; RUST is the channel.
  rust-linux-stable:
    name: Linux x64 clippy stable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST: stable
    steps: &rust_steps
      - name: Install GTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default "$RUST"
      - run: rustup update
      - name: Install clippy
        run: rustup component add clippy
      - name: Run cargo clippy
        run: cargo clippy --manifest-path super_native_extensions/rust/Cargo.toml -- -D warnings
      - name: Run cargo clippy (tests)
        run: cargo clippy --tests --manifest-path super_native_extensions/rust/Cargo.toml -- -D warnings
      - name: Install Rust Android Target
        run: rustup target add armv7-linux-androideabi
        if: runner.os == 'Linux'
      - name: Run cargo clippy (Android)
        if: runner.os == 'Linux'
        run: cargo clippy --target=armv7-linux-androideabi --manifest-path super_native_extensions/rust/Cargo.toml -- -D warnings
      - name: Install Rust iOS Target
        run: rustup target add aarch64-apple-ios
        if: runner.os == 'macOS'
      - name: Run cargo clippy (iOS)
        run: cargo clippy --target=aarch64-apple-ios --manifest-path super_native_extensions/rust/Cargo.toml -- -D warnings
        if: runner.os == 'macOS'
      - name: Run cargo test
        run: cargo test --manifest-path super_native_extensions/rust/Cargo.toml -- --test-threads=1

  rust-linux-nightly:
    name: Linux x64 clippy nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST: nightly
    steps: *rust_steps

  rust-macos-stable:
    name: macOS ARM64 clippy stable
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RUST: stable
    steps: *rust_steps

  rust-macos-nightly:
    name: macOS ARM64 clippy nightly
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RUST: nightly
    steps: *rust_steps

  rust-windows-stable:
    name: Windows x64 clippy stable
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUST: stable
    steps: *rust_steps

  rust-windows-nightly:
    name: Windows x64 clippy nightly
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUST: nightly
    steps: *rust_steps
