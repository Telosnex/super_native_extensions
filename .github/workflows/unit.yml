# The fast checks of every pull request: the workflow lint, format, analyze
# and the host tests (flutter test) of every package. The Rust checks are
# check_and_lint.yml; the integration tests are integration.yml.
name: Unit

on:
  pull_request:
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - uses: Telosnex/telosnex_ci_tools/actions/lint@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      # The host tests run the build hook of super_native_extensions, which
      # builds the Linux library from source when the sources differ from
      # native_artifacts/prebuilt.json.
      - name: Install GTK
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      # The workspace's melos (root pubspec.lock).
      - name: Melos bootstrap
        run: |
          flutter pub get
          dart run melos bootstrap
      # Says when the hooks build the library from source: then every app
      # that depends on this commit builds it too, until a Kiln release.
      - name: Prebuilt files match the sources
        working-directory: super_native_extensions
        run: |
          local_key=$(dart run kiln:key | head -1)
          manifest_key=$(jq -r .sourceKey native_artifacts/prebuilt.json)
          if [[ "$local_key" == "$manifest_key" ]]; then
            echo "Source key $local_key: the hooks use the prebuilt files."
          else
            echo "::warning title=Kiln::The sources (key ${local_key:0:16}) differ from native_artifacts/prebuilt.json (${manifest_key:0:16}): hooks build the Rust library from source. Run the Kiln release to refresh the prebuilt files."
          fi
      - name: Format
        run: dart run melos exec -c 1 dart format . --output=none --set-exit-if-changed
      - name: Analyze
        run: dart run melos exec -c 1 flutter analyze --fatal-infos
      - name: Test
        run: dart run melos exec -c 1 flutter test
